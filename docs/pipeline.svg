<svg xmlns="http://www.w3.org/2000/svg" width="920" height="300" viewBox="0 0 920 300" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#57606a"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0969da"/>
    </marker>
  </defs>

  <!-- row 1 -->
  <rect x="10" y="30" width="150" height="62" rx="8" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="85" y="57" text-anchor="middle" font-size="14.5" font-weight="600" fill="#24292f">Live postings</text>
  <text x="85" y="77" text-anchor="middle" font-size="12" fill="#57606a">employer's own board</text>

  <rect x="205" y="30" width="150" height="62" rx="8" fill="#fff8c5" stroke="#d4a72c" stroke-width="1.5"/>
  <text x="280" y="57" text-anchor="middle" font-size="14.5" font-weight="600" fill="#24292f">Hard gates</text>
  <text x="280" y="77" text-anchor="middle" font-size="12" fill="#57606a">facts only — fail ends it</text>

  <rect x="400" y="30" width="150" height="62" rx="8" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="475" y="57" text-anchor="middle" font-size="14.5" font-weight="600" fill="#24292f">Cited checklist</text>
  <text x="475" y="77" text-anchor="middle" font-size="12" fill="#57606a">no citation, no credit</text>

  <rect x="595" y="30" width="150" height="62" rx="8" fill="#ddf4ff" stroke="#0969da" stroke-width="1.5"/>
  <text x="670" y="57" text-anchor="middle" font-size="14.5" font-weight="600" fill="#24292f">Composite score</text>
  <text x="670" y="77" text-anchor="middle" font-size="12" fill="#57606a">computed, never felt</text>

  <rect x="790" y="30" width="120" height="62" rx="8" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="850" y="57" text-anchor="middle" font-size="14.5" font-weight="600" fill="#24292f">Bands</text>
  <text x="850" y="77" text-anchor="middle" font-size="12" fill="#57606a">Strong / Workable</text>

  <!-- row 2 -->
  <rect x="595" y="150" width="150" height="62" rx="8" fill="#ffebe9" stroke="#cf222e" stroke-width="1.5"/>
  <text x="670" y="177" text-anchor="middle" font-size="14.5" font-weight="600" fill="#24292f">Verification</text>
  <text x="670" y="197" text-anchor="middle" font-size="12" fill="#57606a">demote-only, never up</text>

  <rect x="400" y="150" width="150" height="62" rx="8" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.5"/>
  <text x="475" y="177" text-anchor="middle" font-size="14.5" font-weight="600" fill="#24292f">Submit</text>
  <text x="475" y="197" text-anchor="middle" font-size="12" fill="#57606a">receipt-matched, $0</text>

  <rect x="205" y="150" width="150" height="62" rx="8" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="280" y="177" text-anchor="middle" font-size="14.5" font-weight="600" fill="#24292f">Tracker</text>
  <text x="280" y="197" text-anchor="middle" font-size="12" fill="#57606a">band logged per outcome</text>

  <rect x="10" y="150" width="150" height="62" rx="8" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="85" y="177" text-anchor="middle" font-size="14.5" font-weight="600" fill="#24292f">Calibration</text>
  <text x="85" y="197" text-anchor="middle" font-size="12" fill="#57606a">monthly, human sign-off</text>

  <!-- arrows row 1 -->
  <path d="M 160 61 L 203 61" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M 355 61 L 398 61" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M 550 61 L 593 61" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M 745 61 L 788 61" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <!-- bands down to verification -->
  <path d="M 850 92 C 850 130, 760 128, 700 148" fill="none" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <!-- row 2 arrows (right to left) -->
  <path d="M 595 181 L 552 181" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M 400 181 L 357 181" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M 205 181 L 162 181" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <!-- calibration feedback up to gates -->
  <path d="M 85 150 C 85 115, 200 118, 262 94" fill="none" stroke="#0969da" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrowBlue)"/>
  <text x="120" y="112" font-size="11.5" fill="#0969da">outcomes recalibrate the rubric</text>

  <text x="460" y="262" text-anchor="middle" font-size="12.5" fill="#57606a">Anything irreversible, novel, or outside the written record stops for the human — the run continues without it.</text>
</svg>
